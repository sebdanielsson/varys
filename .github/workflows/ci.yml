name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Build WinUI app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build app/Varys/Varys.csproj -c Release -p:Platform=x64

  sidecar:
    name: Lint sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Lint (syntax + undefined names)
        run: uvx ruff check sidecar/transcribe_sidecar --select=E9,F63,F7,F82

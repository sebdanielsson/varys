name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Release Please maintains a "release PR" that bumps the version (app/Varys/Varys.csproj) and
# CHANGELOG.md from conventional commits. Merging it tags + creates the GitHub release. The build
# and winget jobs run in the SAME workflow run, gated on `release_created`, so they don't depend on
# the release event re-triggering a workflow (GITHUB_TOKEN-created events don't, by design).
#
# The release is created as a DRAFT (`draft: true` in release-please-config.json) and published by
# the last step of the build job. This repo has immutable releases enabled, and GitHub only accepts
# asset uploads before a release is published — publishing first is what left v0.2.0 with no MSI or
# zip, permanently. A draft release does not create its git tag, which the build job checks out, so
# `force-tag-creation: true` makes Release Please push the tag ref explicitly up front.
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Build the win-x64 MSI + portable zip and attach them to the release Release Please just created.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install WiX (v5 — MIT-licensed, no OSMF gate)
        run: dotnet tool install --global wix --version "5.*"
      - name: Resolve version
        id: ver
        shell: pwsh
        run: "echo \"version=$('${{ needs.release-please.outputs.tag_name }}'.TrimStart('v'))\" >> $env:GITHUB_OUTPUT"
      - name: Publish (self-contained win-x64)
        shell: pwsh
        # -p:SelfContained=true is explicit: the publish profile that sets it isn't reliably applied
        # on CI, and a framework-dependent build would ship without the .NET runtime.
        run: |
          dotnet publish app/Varys/Varys.csproj -c Release -p:Platform=x64 -p:SelfContained=true -p:Version=${{ steps.ver.outputs.version }} -p:DebugType=None -o publish
          if (-not (Test-Path publish/coreclr.dll)) { throw "Publish is framework-dependent (no coreclr.dll) - expected self-contained." }
      - name: Bundle sidecar + uv
        shell: pwsh
        run: |
          # Ship only tracked sidecar files (no local .venv / __pycache__) via git archive.
          git archive HEAD sidecar -o sidecar.tar
          tar -xf sidecar.tar -C publish
          Copy-Item (Get-Command uv).Source publish/uv.exe
      - name: Build MSI
        shell: pwsh
        # PublishDir must be ABSOLUTE: WiX resolves the <Files Include> glob relative to the .wxs
        # file's directory, not the working dir. Assert the result isn't a hollow MSI.
        run: |
          wix build installer/Varys.wxs -d Version=${{ steps.ver.outputs.version }} -d PublishDir=$env:GITHUB_WORKSPACE\publish -o Varys-${{ needs.release-please.outputs.tag_name }}-win-x64.msi
          $size = (Get-Item Varys-${{ needs.release-please.outputs.tag_name }}-win-x64.msi).Length
          "MSI size: $([math]::Round($size/1MB,1)) MB"
          if ($size -lt 50MB) { throw "MSI is only $size bytes - the publish harvest is empty." }
      - name: Zip (portable)
        run: Compress-Archive -Path publish/* -DestinationPath Varys-${{ needs.release-please.outputs.tag_name }}-win-x64.zip
      # Filenames are spelled out rather than globbed: PowerShell does not expand wildcards for
      # native commands, so `gh release upload ... Varys-*.msi` would pass the literal string.
      - name: Attach assets to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ needs.release-please.outputs.tag_name }}"
          gh release upload $tag "Varys-$tag-win-x64.msi" "Varys-$tag-win-x64.zip" --clobber
      # Publishing is the LAST step, because immutable releases freeze assets at publish time.
      # If anything above fails, the release stays a draft with the tag already in place — far
      # better than the previous behaviour, which published an empty release you cannot repair.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false --latest

  # Submit the new version to microsoft/winget-pkgs. `wingetcreate update` only works once the
  # package EXISTS — submit the first version by hand (`wingetcreate new <msi-url>`). Until then
  # (or if WINGET_TOKEN is unset) this job warns and succeeds, so it never reddens a release.
  winget:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    steps:
      # microsoft/winget-pkgs takes thousands of commits a week, so the fork goes stale fast, and
      # wingetcreate refuses to submit from a fork it can't fast-forward: "The forked repository
      # could not be synced with the upstream commits." That is what failed the v0.2.1 release,
      # with the fork ~19,700 commits behind. Sync first so it can never be the reason a release
      # doesn't reach winget. Non-fatal: if the sync fails, let wingetcreate try and report.
      - name: Sync the winget-pkgs fork
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { Write-Host "WINGET_TOKEN not set - skipping fork sync."; exit 0 }
          gh repo sync ${{ github.repository_owner }}/winget-pkgs --source microsoft/winget-pkgs
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Could not fast-forward the winget-pkgs fork - it may have diverged from upstream. Reset it to microsoft:master by hand if the submission below fails."
          }

      - name: Submit to winget-pkgs
        shell: pwsh
        run: |
          if (-not "${{ secrets.WINGET_TOKEN }}") { Write-Host "WINGET_TOKEN not set - skipping winget submission."; exit 0 }
          $tag = "${{ needs.release-please.outputs.tag_name }}"
          $ver = $tag.TrimStart('v')
          $url = "https://github.com/sebdanielsson/varys/releases/download/$tag/Varys-$tag-win-x64.msi"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $out = (.\wingetcreate.exe update SebDanielsson.Varys --version $ver --urls $url --submit --token "${{ secrets.WINGET_TOKEN }}" 2>&1 | Out-String)
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            if ($out -match 'was not found') {
              Write-Host "::warning::SebDanielsson.Varys isn't in winget-pkgs yet. Submit the first version once with 'wingetcreate new <msi-url>'; after it's merged this job auto-updates each release."
              exit 0
            }
            if ($out -match 'could not be synced') {
              Write-Host "::error::The winget-pkgs fork is out of sync with upstream and the sync step above could not fix it. Reset it with: gh repo sync ${{ github.repository_owner }}/winget-pkgs --source microsoft/winget-pkgs --force"
              exit 1
            }
            Write-Host "::error::winget submission failed."
            exit 1
          }

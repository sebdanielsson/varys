name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Publishes two win-x64 artifacts for a v* tag:
#   - Varys-<tag>-win-x64.msi  — installs to Program Files (Start-Menu shortcut, clean uninstall)
#   - Varys-<tag>-win-x64.zip  — portable (unzip and run)
# Both contain the self-contained WinUI app + the sidecar source + uv.exe. The Python engine,
# speech + language models, and Ollama are NOT bundled — the first-run welcome provisions them.
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write       # create the release + upload assets
      pull-requests: read    # generate_release_notes reads merged PRs for the changelog
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: "10.0.x"
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Install WiX (v5 — MIT-licensed, no OSMF gate)
        run: dotnet tool install --global wix --version "5.*"
      - name: Resolve version
        id: ver
        shell: pwsh
        run: "echo \"version=$('${{ github.ref_name }}'.TrimStart('v'))\" >> $env:GITHUB_OUTPUT"
      - name: Publish (self-contained win-x64)
        shell: pwsh
        # -p:SelfContained=true is explicit: the publish profile that sets it isn't reliably
        # applied by `dotnet publish` on CI, and a framework-dependent build would ship without
        # the .NET runtime. Assert coreclr.dll is present so that regression fails loudly.
        run: |
          dotnet publish app/Varys/Varys.csproj -c Release -p:Platform=x64 -p:SelfContained=true -p:Version=${{ steps.ver.outputs.version }} -p:DebugType=None -o publish
          if (-not (Test-Path publish/coreclr.dll)) { throw "Publish is framework-dependent (no coreclr.dll) - expected self-contained." }
      - name: Bundle sidecar + uv
        shell: pwsh
        run: |
          # Ship only tracked sidecar files (no local .venv / __pycache__) via git archive.
          git archive HEAD sidecar -o sidecar.tar
          tar -xf sidecar.tar -C publish
          Copy-Item (Get-Command uv).Source publish/uv.exe
      - name: Build MSI
        shell: pwsh
        # PublishDir must be ABSOLUTE: WiX resolves the <Files Include> glob relative to the
        # .wxs file's directory (installer/), not the working dir. A relative path silently
        # harvests nothing, so assert the result isn't a hollow MSI.
        run: |
          wix build installer/Varys.wxs -d Version=${{ steps.ver.outputs.version }} -d PublishDir=$env:GITHUB_WORKSPACE\publish -o Varys-${{ github.ref_name }}-win-x64.msi
          $size = (Get-Item Varys-${{ github.ref_name }}-win-x64.msi).Length
          "MSI size: $([math]::Round($size/1MB,1)) MB"
          if ($size -lt 50MB) { throw "MSI is only $size bytes - the publish harvest is empty." }
      - name: Zip (portable)
        run: Compress-Archive -Path publish/* -DestinationPath Varys-${{ github.ref_name }}-win-x64.zip
      - name: Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: |
            Varys-*.msi
            Varys-*.zip
          generate_release_notes: true
